<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d2510"/>
      <stop offset="70%" stop-color="#050d06"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#33ff66" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#33ff66" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softNeon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#000" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Solid background (iOS requires opaque) -->
  <rect width="180" height="180" fill="#0a0a0a"/>
  <rect width="180" height="180" fill="url(#bgGrad)"/>

  <!-- Center glow -->
  <circle cx="90" cy="90" r="80" fill="url(#glowCenter)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#33ff66" stroke-width="0.4" opacity="0.08">
    <line x1="0" y1="45" x2="180" y2="45"/>
    <line x1="0" y1="90" x2="180" y2="90"/>
    <line x1="0" y1="135" x2="180" y2="135"/>
    <line x1="45" y1="0" x2="45" y2="180"/>
    <line x1="90" y1="0" x2="90" y2="180"/>
    <line x1="135" y1="0" x2="135" y2="180"/>
  </g>

  <!-- Outer ring (decorative) -->
  <circle cx="90" cy="90" r="76" fill="none" stroke="#33ff66" stroke-width="1" opacity="0.25"/>
  <circle cx="90" cy="90" r="72" fill="none" stroke="#33ff66" stroke-width="0.5" opacity="0.15"/>

  <!-- Clock face (main element) -->
  <circle cx="90" cy="90" r="58" fill="none" stroke="#33ff66" stroke-width="3" filter="url(#neon)"/>

  <!-- 13 hour markers -->
  <g stroke="#33ff66" stroke-width="2" stroke-linecap="round">
    <!-- Hour 1 -->
    <line x1="90" y1="32" x2="90" y2="42"/>
    <!-- Rotate 27.69° for each hour (360/13) -->
    <g transform="rotate(27.69 90 90)">
      <line x1="90" y1="32" x2="90" y2="42"/>
    </g>
    <g transform="rotate(55.38 90 90)">
      <line x1="90" y1="32" x2="90" y2="42"/>
    </g>
    <g transform="rotate(83.08 90 90)">
      <line x1="90" y1="32" x2="90" y2="42"/>
    </g>
    <g transform="rotate(110.77 90 90)">
      <line x1="90" y1="32" x2="90" y2="42"/>
    </g>
    <g transform="rotate(138.46 90 90)">
      <line x1="90" y1="32" x2="90" y2="42"/>
    </g>
    <g transform="rotate(166.15 90 90)">
      <line x1="90" y1="32" x2="90" y2="42"/>
    </g>
    <g transform="rotate(193.85 90 90)">
      <line x1="90" y1="32" x2="90" y2="42"/>
    </g>
    <g transform="rotate(221.54 90 90)">
      <line x1="90" y1="32" x2="90" y2="42"/>
    </g>
    <g transform="rotate(249.23 90 90)">
      <line x1="90" y1="32" x2="90" y2="42"/>
    </g>
    <g transform="rotate(276.92 90 90)">
      <line x1="90" y1="32" x2="90" y2="42"/>
    </g>
    <g transform="rotate(304.61 90 90)">
      <line x1="90" y1="32" x2="90" y2="42"/>
    </g>
    <g transform="rotate(332.31 90 90)">
      <line x1="90" y1="32" x2="90" y2="42"/>
    </g>
  </g>

  <!-- The 13th hour marker (RED — distinguishes from normal clock) -->
  <line x1="90" y1="26" x2="90" y2="40" stroke="#ff5555" stroke-width="3" stroke-linecap="round" filter="url(#neon)"/>

  <!-- Clock hands (frozen at 13:00) -->
  <line x1="90" y1="90" x2="90" y2="52" stroke="#7dffa5" stroke-width="4" stroke-linecap="round" filter="url(#neon)"/>
  <line x1="90" y1="90" x2="122" y2="90" stroke="#7dffa5" stroke-width="3" stroke-linecap="round" filter="url(#neon)"/>

  <!-- Center dot -->
  <circle cx="90" cy="90" r="6" fill="#0a0a0a" stroke="#33ff66" stroke-width="2"/>
  <circle cx="90" cy="90" r="2.5" fill="#33ff66" filter="url(#neon)"/>

  <!-- Corner brackets (surveillance frame) -->
  <g stroke="#33ff66" stroke-width="2.5" fill="none" opacity="0.85">
    <polyline points="14,14 14,30"/>
    <polyline points="14,14 30,14"/>
    <polyline points="166,14 166,30"/>
    <polyline points="166,14 150,14"/>
    <polyline points="14,166 14,150"/>
    <polyline points="14,166 30,166"/>
    <polyline points="166,166 166,150"/>
    <polyline points="166,166 150,166"/>
  </g>

  <!-- "07" — Department number (small, bottom right) -->
  <text x="150" y="30" font-family="monospace" font-size="10" fill="#33ff66" text-anchor="middle" letter-spacing="1" opacity="0.8">07</text>

  <!-- Scanlines overlay -->
  <rect width="180" height="180" fill="url(#scanlines)"/>

  <!-- Vignette -->
  <rect width="180" height="180" fill="url(#bgGrad)" opacity="0.15"/>
</svg>
